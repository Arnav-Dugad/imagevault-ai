name: ImageVault CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend lint, tests, build, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        working-directory: frontend
        run: npm ci
      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-production validation environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate Dockerfiles
        run: |
          docker build --check -f backend/Dockerfile backend
          docker build --check -f backend/Dockerfile.worker backend
          docker build --check -f frontend/Dockerfile frontend
      - name: Validate Kubernetes render
        run: kubectl kustomize infra/kubernetes > /tmp/imagevault-kubernetes.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Terraform initialize
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
