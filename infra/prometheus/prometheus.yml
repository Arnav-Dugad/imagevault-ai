global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: imagevault-api
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: imagevault-worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
