apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: imagevault
spec:
  selector:
    app: imagevault-backend
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagevault-backend
  namespace: imagevault
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagevault-backend
  template:
    metadata:
      labels:
        app: imagevault-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: imagevault/backend:local
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          envFrom:
            - configMapRef: {name: imagevault-config}
            - secretRef: {name: imagevault-secrets}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: imagevault
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: imagevault
spec:
  selector:
    app: imagevault-worker
  ports:
    - {name: metrics, port: 9101, targetPort: 9101}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagevault-worker
  namespace: imagevault
  labels:
    app.kubernetes.io/component: ai-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: imagevault-worker
  template:
    metadata:
      labels:
        app: imagevault-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: imagevault/worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: imagevault-config}
            - secretRef: {name: imagevault-secrets}
          env:
            - {name: METRICS_PORT, value: "9101"}
            - {name: TORCH_HOME, value: /home/imagevault/.cache/torch}
            - {name: HF_HOME, value: /home/imagevault/.cache/huggingface}
          ports:
            - {name: metrics, containerPort: 9101}
          readinessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: metrics}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: cache, mountPath: /home/imagevault/.cache}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: imagevault
spec:
  selector:
    app: imagevault-frontend
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagevault-frontend
  namespace: imagevault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagevault-frontend
  template:
    metadata:
      labels:
        app: imagevault-frontend
    spec:
      containers:
        - name: frontend
          image: imagevault/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: imagevault-gateway
  namespace: imagevault
spec:
  type: NodePort
  selector:
    app: imagevault-nginx
  ports:
    - {name: http, port: 80, targetPort: 80, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagevault-nginx
  namespace: imagevault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagevault-nginx
  template:
    metadata:
      labels:
        app: imagevault-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
      volumes:
        - name: config
          configMap:
            name: imagevault-nginx
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: imagevault-backend
  namespace: imagevault
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: imagevault-backend
