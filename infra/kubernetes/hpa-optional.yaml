# Optional: requires `minikube addons enable metrics-server`.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imagevault-backend
  namespace: imagevault
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imagevault-backend
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
