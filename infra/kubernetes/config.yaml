apiVersion: v1
kind: ConfigMap
metadata:
  name: imagevault-config
  namespace: imagevault
data:
  APP_VERSION: "1.0.0"
  ENVIRONMENT: kubernetes
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:30090
  MINIO_BUCKET: imagevault
  MINIO_SECURE: "false"
  MINIO_PUBLIC_SECURE: "false"
  CORS_ORIGINS: http://localhost:30080,http://127.0.0.1:30080
  MAX_UPLOAD_BYTES: "15728640"
  MAX_BATCH_FILES: "20"
  VISUAL_SIMILARITY_THRESHOLD: "0.85"
  PERCEPTUAL_HASH_THRESHOLD: "8"
  SIMILARITY_CANDIDATE_LIMIT: "60"
  PERCEPTUAL_PREFILTER_DISTANCE: "18"
  CLIP_MODEL: ViT-B-32
  CLIP_PRETRAINED: laion2b_s34b_b79k
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imagevault-nginx
  namespace: imagevault
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format json escape=json '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
      access_log /var/log/nginx/access.log json;
      client_max_body_size 320m;
      upstream api { server backend:8000; }
      upstream web { server frontend:8080; }
      server {
        listen 80;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        location ~ ^/(api|health|metrics|docs|redoc|openapi.json) {
          proxy_pass http://api;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Request-ID $request_id;
        }
        location / {
          proxy_pass http://web;
          proxy_set_header Host $host;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imagevault-prometheus
  namespace: imagevault
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: imagevault-api
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]
      - job_name: imagevault-worker
        static_configs:
          - targets: ["worker:9101"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imagevault-grafana-provisioning
  namespace: imagevault
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: ImageVault AI
        folder: ImageVault AI
        type: file
        options:
          path: /var/lib/grafana/dashboards
