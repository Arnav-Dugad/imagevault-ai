user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 320m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=3r/s;

    upstream api { server backend:8000; keepalive 16; }
    upstream web { server frontend:8080; keepalive 8; }

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /api/images/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            proxy_request_buffering off;
            proxy_pass http://api;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Request-ID $request_id;
        }

        location ~ ^/(api|health|metrics|docs|redoc|openapi.json) {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://api;
            include /etc/nginx/proxy_params;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://web;
            include /etc/nginx/proxy_params;
        }
    }
}
