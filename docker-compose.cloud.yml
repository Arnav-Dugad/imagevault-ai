# Standalone: do not combine with docker-compose.yml.
name: imagevault-cloud
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imagevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.cloud}
      POSTGRES_DB: ${POSTGRES_DB:-imagevault}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-imagevault} -d ${POSTGRES_DB:-imagevault}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - noeviction
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &cloud-environment
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Copy .env.cloud.example to .env.cloud and configure DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env.cloud}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-314572800}
      MAX_BATCH_FILES: ${MAX_BATCH_FILES:-20}
      VISUAL_SIMILARITY_THRESHOLD: ${VISUAL_SIMILARITY_THRESHOLD:-0.85}
      PERCEPTUAL_HASH_THRESHOLD: ${PERCEPTUAL_HASH_THRESHOLD:-8}
      SIMILARITY_CANDIDATE_LIMIT: ${SIMILARITY_CANDIDATE_LIMIT:-60}
      PERCEPTUAL_PREFILTER_DISTANCE: ${PERCEPTUAL_PREFILTER_DISTANCE:-18}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion2b_s34b_b79k}
      ANALYSIS_VERSION: ${ANALYSIS_VERSION:-5}
      AI_DEVICE: cpu
      MEDIA_SAMPLE_FRAMES: ${MEDIA_SAMPLE_FRAMES:-6}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+hin+mar+ben+tam+tel+guj+pan}
      FACE_CLUSTER_THRESHOLD: ${FACE_CLUSTER_THRESHOLD:-0.30}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-azure}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-imagevault}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      PRESIGNED_URL_EXPIRE_MINUTES: ${PRESIGNED_URL_EXPIRE_MINUTES:-15}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment: *cloud-environment
    volumes:
    - model-cache:/home/imagevault/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
    - '9101'
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  nginx:
    image: nginx:1.27-alpine
    volumes:
    - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
    - 127.0.0.1:8080:80
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1/health/live
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
    - vault
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  vault:
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
  model-cache: null
